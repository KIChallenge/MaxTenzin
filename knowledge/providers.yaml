# Appointment providers — owner: WS-T (appointments).
#
# Two kinds of entries:
#   demo: false  REAL facilities. Name/address/phone are taken from a cited source (ÖGK Serviceratgeber 2026
#                S. 90–96, PVA PAL 080 S. 8, FSW Antrag auf Förderung S. 1 — same sources as knowledge/offices.yaml).
#                The SLOTS offered for them are still synthetic demo slots (no real booking system is connected).
#   demo: true   SYNTHETIC demo practices with obviously fictional names "(Demo)". Address/phone are invented.
#
# topics = benefit ids (knowledge/benefits.yaml), prevention ids (knowledge/prevention.yaml) and a few
# appointment tags (hausarzt_kontrolle, koloskopie, darmkrebs_vorsorge, ernaehrungsberatung, impfung …).
# The service additionally normalises aliases (e.g. vu -> vorsorgeuntersuchung, darmkrebs -> darmkrebs_vorsorge).
#
# hours (optional) override the opening hours of the provider kind: weekday (mon..fri) -> list of "HH:MM-HH:MM".
# slot_minutes (optional) overrides the kind default (20 or 30 minutes).

topic_sets:
  gp: &gp [allgemeinmedizin, hausarzt, hausarzt_kontrolle, vorsorgeuntersuchung, influenza, covid19, impfung,
           rezept, ueberweisung]
  oegk_ks: &oegk_ks [oegk_kundenservice, rezeptgebuehrenbefreiung, rezeptgebuehrenobergrenze, fahrtkostenzuschuss,
                     krankentransport, hauskrankenpflege, unterstuetzungsfonds, reha, reha_onko, eltern_kind_pass]
  oegk_gz: &oegk_gz [gesundheitszentrum, vorsorgeuntersuchung]
  pva: &pva [pflegegeld, pflegeberatung, pension, reha, reha_onko]


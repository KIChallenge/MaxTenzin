# Prevention rules (owner: WS-D). Read ONLY by app/services/prevention/engine.py — deterministic, no LLM.
#
# Every rule carries its sources. Two kinds:
#   brochure  — ÖGK Serviceratgeber 2026 (knowledge/extracted/serviceratgeber/pages.jsonl, printed page);
#               `quote` must occur verbatim (whitespace-normalised) on that page — enforced by tests.
#   external  — Österreichischer Impfplan (NOT in the provided data). Cited with URL + retrieval date and
#               shown to the user as an external source. Intervals below are taken from the WS-D brief and
#               were not re-verified against the live Impfplan PDF (see prevention README, Limitations).
#
# Rule fields:
#   kind: vaccination | screening
#   match: disease names (e-Impfpass, canonical, see impfpass.py) that count as a documented dose
#   min_age / max_age: years at as_of (inclusive); sex: w | m (optional)
#   logic: seasonal (annual autumn season) | interval (interval_years, interval_years_60plus)
#          | info (show availability only; no due computation)
#          | annual_screening | age_range_screening

sources:
  impfplan:
    kind: external
    label: "Impfplan Österreich 2025/2026 (externe Quelle, abgerufen am 05.11.2026)"
    url: "https://www.sozialministerium.gv.at/impfplan"
    retrieved: "2026-11-05"
  sr23:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 23"
    page: 23
    quote: "Die ÖGK lädt Personen ab 18 Jahren ein, zur kostenlosen Vorsorgeuntersuchung zu gehen."
  sr24:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 24"
    page: 24
    quote: "Zur Krebsvorsorge bzw. zur Früherkennung von Dickdarmkrebs wird bei der Vorsorgeuntersuchung ab dem 45. Lebensjahr alle zehn Jahre eine Darmspiegelung (Koloskopie) und bei jeder Vorsorgeuntersuchung ein Test auf okkultes (optisch nicht sichtbares) Blut im Stuhl angeboten."
  sr25:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 25"
    page: 25
    quote: "Bei Frauen zwischen 45 und 74 Jahren ist die e-card für die Mammografie alle zwei Jahre automatisch freigeschaltet."
  sr25_optin:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 25"
    page: 25
    quote: "Frauen zwischen 40 und 44 sowie ab 75 Jahren können sich bei der kostenlosen Service-line 0800 500 181 oder auf www. frueh-erkennen.at zum Programm anmelden."
  sr23_fragebogen:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 23"
    page: 23
    quote: "Zuerst füllen Sie einen Fragebogen zu unterschiedlichen Themen aus (z.B. zu eigenen Vorerkrankungen, erblicher Vorbelastung, Bewegung, Alkoholkonsum)."
  sr23_stoffwechsel:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 23"
    page: 23
    quote: "Stoffwechselerkrankungen (z.B. Diabetes)"
  sr24_risiken:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 24"
    page: 24
    quote: "Bei der Vorsorgeuntersuchung werden die häufigsten beeinflussbaren Gesundheitsrisiken wie Übergewicht, Bluthochdruck, Rauchen und Bewegungsmangel abgeklärt."
  sr25_familiaer:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 25"
    page: 25
    quote: "wenn ein familiär erhöhtes Risiko besteht, ist eine Zuweisung zur diagnostischen Mammografie unabhängig vom Alter durch eine Ärztin oder einen Arzt jederzeit möglich."
  sr32_free:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 32"
    page: 32
    quote: "Das sind für Erwachsene z.B. Impfungen gegen Influenza („echte“ Grippe), COVID-19 sowie ab 60 Jahren gegen Gürtelrose und Pneumokokken."
  sr32_fsme:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 32"
    page: 32
    quote: "Für Zeckenimpfungen (FSME) können Sie einen Kostenzuschuss erhalten."
  sr32_kids:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 32"
    page: 32
    quote: "Für Kinder gibt es ein umfangreiches kostenloses Impfangebot."
  sr32_scope:
    kind: brochure
    label: "ÖGK Serviceratgeber 2026, S. 32"
    page: 32
    quote: "Die ÖGK ist gesetzlich zwar grundsätzlich nicht für Impfungen zuständig, beteiligt sich aber finanziell an österreichweiten Impfprogrammen, die der Bevölkerung bestimmte kostenlose Impfungen ermöglichen."

rules:
  - id: influenza
    kind: vaccination
    title_de: "Influenza-Impfung (Grippe)"
    match: [Influenza]
    min_age: 18
    logic: seasonal
    season_start_month: 9      # a dose from September on counts for the season
    due_from_month: 10         # recommended from October ("jährlich im Herbst")
    recommendation_de: "Laut Impfplan wird die Grippeimpfung jährlich im Herbst empfohlen."
    cost_de: "kostenlos im Rahmen des öffentlichen Impfprogramms"
    sources: [impfplan, sr32_free]
  - id: covid19
    kind: vaccination
    title_de: "COVID-19-Auffrischung"
    match: [COVID-19]
    min_age: 60
    logic: seasonal
    season_start_month: 9
    due_from_month: 10
    recommendation_de: "Laut Impfplan wird ab 60 Jahren (und für Risikogruppen) eine jährliche COVID-19-Auffrischung im Herbst empfohlen."
    cost_de: "kostenlos im Rahmen des öffentlichen Impfprogramms"
    sources: [impfplan, sr32_free]
  - id: dtp_polio
    kind: vaccination
    title_de: "Diphtherie-Tetanus-Pertussis-Polio (Auffrischung)"
    match: [Diphtherie, Tetanus, Pertussis, Polio]
    min_age: 18
    logic: interval
    interval_years: 10
    interval_years_60plus: 5
    recommendation_de: "Laut Impfplan wird die Auffrischung alle 10 Jahre empfohlen, ab 60 Jahren alle 5 Jahre."
    cost_de: "Impfungen für Erwachsene sind großteils privat zu bezahlen"
    sources: [impfplan, sr32_scope]
  - id: herpes_zoster
    kind: vaccination
    title_de: "Impfung gegen Gürtelrose (Herpes zoster)"
    match: [Herpes zoster]
    min_age: 60
    logic: info
    recommendation_de: "Ab 60 Jahren ist die Impfung gegen Gürtelrose im Rahmen eines Impfprogramms kostenlos."
    cost_de: "kostenlos ab 60 Jahren"
    sources: [sr32_free]
  - id: pneumococcal
    kind: vaccination
    title_de: "Impfung gegen Pneumokokken"
    match: [Pneumokokken]
    min_age: 60
    logic: info
    recommendation_de: "Ab 60 Jahren ist die Impfung gegen Pneumokokken im Rahmen eines Impfprogramms kostenlos."
    cost_de: "kostenlos ab 60 Jahren"
    sources: [sr32_free]
  - id: fsme
    kind: vaccination
    title_de: "FSME-Impfung (Zecken)"
    match: [FSME]
    min_age: 18
    logic: info
    recommendation_de: "Für die FSME-Impfung (Zeckenimpfung) gibt es einen Kostenzuschuss der ÖGK."
    cost_de: "Kostenzuschuss der ÖGK möglich"
    sources: [sr32_fsme]
  - id: kinderimpfprogramm
    kind: vaccination
    title_de: "Kostenloses Kinderimpfprogramm"
    match: []
    max_age: 17
    logic: info
    recommendation_de: "Für Kinder gibt es ein umfangreiches kostenloses Impfangebot."
    cost_de: "kostenlos"
    sources: [sr32_kids]
  - id: vu
    kind: screening
    title_de: "Vorsorgeuntersuchung"
    min_age: 18
    logic: annual_screening
    recommendation_de: "Ab 18 Jahren ist die Vorsorgeuntersuchung einmal jährlich kostenlos möglich."
    cost_de: "kostenlos"
    sources: [sr23]
  - id: darmkrebs
    kind: screening
    title_de: "Darmkrebs-Früherkennung im Rahmen der Vorsorgeuntersuchung"
    min_age: 45
    logic: annual_screening
    recommendation_de: "Ab 45 Jahren werden bei der Vorsorgeuntersuchung alle zehn Jahre eine Darmspiegelung und bei jeder Vorsorgeuntersuchung ein Test auf Blut im Stuhl angeboten."
    cost_de: "kostenlos im Rahmen der Vorsorgeuntersuchung"
    sources: [sr24]
  - id: mammografie
    kind: screening
    title_de: "Mammografie (Brustkrebs-Früherkennungsprogramm)"
    sex: w
    min_age: 40
    logic: age_range_screening
    range_min: 45
    range_max: 74
    recommendation_de: "Bei Frauen zwischen 45 und 74 Jahren ist die e-card für die Mammografie alle zwei Jahre automatisch freigeschaltet."
    optin_de: "Frauen zwischen 40 und 44 sowie ab 75 Jahren können sich bei der kostenlosen Serviceline 0800 500 181 oder auf www.frueh-erkennen.at zum Programm anmelden."
    cost_de: "kostenlos"
    sources: [sr25, sr25_optin]

# ---------------------------------------------------------------------------------------------------------------------
# Family history ("Intelligente Erklärungen", use case 3.4) — owner: WS-K2.
# Input: facts.family_history = list of conditions the person states for their family (e.g. ["darmkrebs"]).
# Effect: matching programme items are marked "Besonders relevant" with an explanation that cites the OFFICIAL
# programme only. No risk numbers, no individual risk assessment, no earlier/extra examinations recommended —
# every explanation ends with doctor_note_de. If the programme item is not shown because of age/sex, an info item
# (status upcoming, due at the programme age) is added so the programme is still explained (`add_if_absent`).
# `match`: lower-case aliases (umlauts folded: ä->ae, ö->oe, ü->ue, ß->ss) of the stated condition.
family_history:
  doctor_note_de: "Ob und wann für Sie eine frühere oder zusätzliche Untersuchung sinnvoll ist, entscheidet Ihre Ärztin bzw. Ihr Arzt – sprechen Sie die Familiengeschichte bei der Vorsorgeuntersuchung an."
  rules:
    - id: darmkrebs
      label_de: Darmkrebs
      match: [darmkrebs, dickdarmkrebs, kolonkarzinom, kolorektales karzinom, colon cancer, bowel cancer, colorectal cancer]
      items: [darmkrebs, vu]
      add_if_absent: darmkrebs
      explanation_de: "Sie haben angegeben, dass in Ihrer Familie Darmkrebs vorgekommen ist. Im offiziellen Programm werden bei der Vorsorgeuntersuchung ab dem 45. Lebensjahr alle zehn Jahre eine Darmspiegelung (Koloskopie) und bei jeder Vorsorgeuntersuchung ein Test auf nicht sichtbares Blut im Stuhl angeboten. Im Fragebogen der Vorsorgeuntersuchung wird auch nach erblicher Vorbelastung gefragt."
      sources: [sr24, sr23_fragebogen]
    - id: brustkrebs
      label_de: Brustkrebs
      match: [brustkrebs, mammakarzinom, breast cancer]
      items: [mammografie, vu]
      add_if_absent: mammografie
      explanation_de: "Sie haben angegeben, dass in Ihrer Familie Brustkrebs vorgekommen ist. Im Brustkrebs-Früherkennungsprogramm „früh erkennen“ ist die e-card bei Frauen zwischen 45 und 74 Jahren alle zwei Jahre für die Mammografie freigeschaltet; laut Programm ist bei einem familiär erhöhten Risiko eine ärztliche Zuweisung zur Mammografie unabhängig vom Alter möglich – ob das auf Sie zutrifft, beurteilt Ihre Ärztin bzw. Ihr Arzt."
      sources: [sr25, sr25_familiaer]
    - id: diabetes
      label_de: Diabetes
      match: [diabetes, zuckerkrankheit, zucker, diabetes mellitus]
      items: [vu]
      explanation_de: "Sie haben angegeben, dass in Ihrer Familie Diabetes vorkommt. Die Vorsorgeuntersuchung konzentriert sich unter anderem auf Stoffwechselerkrankungen wie Diabetes; dabei werden Blutzucker- und Blutfettwerte bestimmt, und im Fragebogen wird nach erblicher Vorbelastung gefragt."
      sources: [sr23_stoffwechsel, sr23_fragebogen]
    - id: herz_kreislauf
      label_de: Herz-Kreislauf-Erkrankungen
      match: [herz_kreislauf, herz-kreislauf, herzkreislauf, herzinfarkt, schlaganfall, herzerkrankung, bluthochdruck, heart disease, stroke]
      items: [vu]
      explanation_de: "Sie haben angegeben, dass in Ihrer Familie Herz-Kreislauf-Erkrankungen vorkommen. Die Vorsorgeuntersuchung widmet sich unter anderem der Prävention von Herz-Kreislauf-Erkrankungen; dabei werden häufige beeinflussbare Gesundheitsrisiken wie Übergewicht, Bluthochdruck, Rauchen und Bewegungsmangel abgeklärt."
      sources: [sr23, sr24_risiken, sr23_fragebogen]

      Die ÖGK übernimmt bzw. bezuschusst notwendige Heilbehelfe (z. B. Einlagen, Kompressionsstrümpfe) und Hilfsmittel
      (z. B. Gehhilfen, Rollator, Rollstuhl) auf ärztliche Verordnung. Versicherte tragen einen Kostenanteil;
      manche Artikel müssen vorher genehmigt werden, manche werden leihweise zur Verfügung gestellt.
    plain_de: Die ÖGK zahlt bei Hilfen wie Rollator oder Gehhilfe mit, wenn die Ärztin oder der Arzt sie verschreibt.

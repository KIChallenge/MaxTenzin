  - id: ersatzpflege
    name_de: Zuwendung zu den Kosten der Ersatzpflege (pflegende Angehörige)
    area: D
    provider: Sozialministeriumservice
    summary_de: >-
      Zuschuss für nahe Angehörige, die seit mindestens einem Jahr überwiegend pflegen und wegen Krankheit, Urlaub
      oder aus anderen wichtigen Gründen verhindert sind (Ersatzpflege). Voraussetzung u. a. Pflegegeld ab Stufe 3
      (bei nachweislicher Demenz oder minderjährigen Pflegebedürftigen ab Stufe 1). Kein Rechtsanspruch; Ansuchen beim
      Sozialministeriumservice.
    plain_de: Geld für eine Vertretung, wenn Sie als pflegende Angehörige einmal ausfallen oder Urlaub brauchen.
    form_ids: []
    required_documents_de:
      - Ansuchen an das Sozialministeriumservice
      - Nachweis über die Kosten der Ersatzpflege
      - Nachweis über das Pflegegeld der gepflegten Person
    legal_basis:
      - {law: BPGG, nr: "21a"}
    sources:
      - {law: BPGG, nr: "21a", abs: "2"}
    value_refs: []
    criteria:
      ep_level:
        label_de: Pflegegeld ab Stufe 3 (bei nachweislicher Demenz oder Minderjährigen ab Stufe 1)
        source: {law: BPGG, nr: "21a", abs: "1"}
      ep_carer_year:
        label_de: Überwiegende Pflege als naher Angehöriger seit mindestens einem Jahr
        source: {law: BPGG, nr: "21a", abs: "1"}
      ep_prevented:
        label_de: Verhinderung wegen Krankheit, Urlaub oder aus sonstigen wichtigen Gründen
        source: {law: BPGG, nr: "21a", abs: "1"}
      ep_hardship:
        label_de: Soziale Härte; Gewährung nach Maßgabe der verfügbaren Mittel
        source: {law: BPGG, nr: "21a", abs: "1"}

  - id: foerderung_24h_betreuung
    name_de: Förderung der 24-Stunden-Betreuung
    area: D
    provider: Sozialministeriumservice
    summary_de: >-
      Zuwendung zu den Kosten einer 24-Stunden-Betreuung zu Hause nach dem Hausbetreuungsgesetz. Voraussetzungen u. a.
      Bedarf an einer bis zu 24-Stunden-Betreuung, Pflegegeld ab Stufe 3 und eine qualifizierte Betreuungskraft.
      Kein Rechtsanspruch; Gewährung nach Maßgabe der verfügbaren Mittel.
    plain_de: Zuschuss, wenn eine Betreuerin oder ein Betreuer rund um die Uhr zu Hause hilft.
    form_ids: []
    required_documents_de:
      - Antrag beim Sozialministeriumservice
      - Nachweis über das Pflegegeld (mindestens Stufe 3)
      - Nachweise über die Betreuungskraft (Vertrag, Qualifikation)

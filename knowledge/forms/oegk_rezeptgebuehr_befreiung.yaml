# ÖGK – Antrag auf Befreiung von der Rezeptgebühr (ÖGK-KSLS/0088-01/V01, Stand 2026).
# Template downloaded from oegk.at on 2026-11-06 (not part of docs/; provenance in knowledge/extracted/MANIFEST.json,
# entry form_templates_downloaded). Info page: https://www.oegk.at/cdscontent/?contentid=10007.870471&portal=oegkportal
# Income types, household members, number of packages and the signature are the person's own declaration: never
# prefilled (except the amount the person already stated for the benefit check, unconfirmed and with its source).
# No consent/declaration boxes exist on this form; the declarations are confirmed by the signature only.
form_id: oegk_rezeptgebuehr_befreiung
title_de: Antrag auf Befreiung von der Rezeptgebühr (ÖGK)
provider: ÖGK
form_version: ÖGK-KSLS/0088-01/V01
submit_info_de: >-
  Zutreffende Einkommensarten ankreuzen, aktuelle Einkommensnachweise aller im Haushalt lebenden Personen in Kopie
  beilegen (z. B. Pensionsbescheid), selbst unterschreiben und bei der ÖGK einreichen (z. B. per Post oder in einem
  ÖGK-Kundenservice). Der Antrag wird nicht automatisch eingereicht.
sections:
  - 1 Persönliche Daten
  - 2 Einkommen
  - 2 Land- und Forstwirtschaft
  - 3 Personen im gemeinsamen Haushalt
  - 4 Krankheitskosten
  - Erklärungen und Unterschrift
unmapped_pdf_fields: {}
fields:

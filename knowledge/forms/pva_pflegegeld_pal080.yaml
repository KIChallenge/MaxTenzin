  - id: Datum_1
    label_de: Datum (neben der Unterschrift)
    type: date
    section: 11 Erklärung und Unterlagen
    prefill: system.today
  - id: Unterlagen
    label_de: Beilagen (Zeile 1)
    type: text
    section: 11 Erklärung und Unterlagen
    prefill: document.attachment
    recommended: true
    ask_hint_de: Welche Unterlagen legen Sie bei (z. B. Kopie des Entlassungsbriefs, Befunde, Vollmacht)?
  - id: Unterlagen2
    label_de: Beilagen (Zeile 2)
    type: text
    section: 11 Erklärung und Unterlagen
    prefill: "const:Kopie des Vertretungsnachweises (Vollmacht)"
    when: {proxy: true}

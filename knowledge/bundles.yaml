      - {kind: benefit, ref: hauskrankenpflege, why_de: "Medizinische Pflege zu Hause auf ärztliche Anordnung, statt länger im Spital zu bleiben."}
      - {kind: benefit, ref: fsw_mobile_pflege, why_de: "Unterstützung zu Hause (Heimhilfe, mobile Pflege) in Wien."}
      - {kind: benefit, ref: pflegegeld, why_de: "Wenn voraussichtlich länger als sechs Monate Hilfe nötig ist."}
      - {kind: form, ref: pva_pflegegeld_pal080, if_benefit: pflegegeld, why_de: "Antrag auf Pflegegeld bei der PVA, vorausgefüllt zum Prüfen und Unterschreiben."}
      - {kind: benefit, ref: pflegeberatung, why_de: "Kostenlose Beratung zu Hause durch eine Pflegefachkraft."}
      - {kind: benefit, ref: reha_onko, why_de: "Reha im Anschluss an die Behandlung – Antrag mit ärztlicher Begründung."}
      - {kind: form, ref: sv_kur_reha, if_benefit: reha_onko, why_de: "Antrag auf Rehabilitation; die ärztliche Stellungnahme füllt die Ärztin bzw. der Arzt aus."}
      - {kind: benefit, ref: krankentransport, why_de: "Transport zu Behandlungen, wenn eine ärztliche Transportanweisung vorliegt."}
      - {kind: benefit, ref: fahrtkostenzuschuss, why_de: "Zuschuss zu weiten Fahrten zur Behandlung."}
      - {kind: benefit, ref: heilbehelfe_hilfsmittel, why_de: "Hilfsmittel wie Rollator oder Gehhilfe auf ärztliche Verordnung."}
      - {kind: benefit, ref: rezeptgebuehrenbefreiung, why_de: "Bei geringem Einkommen keine Rezeptgebühr; entlastet bei vielen Medikamenten."}
      - {kind: office, ref: oegk_kundenservice, why_de: "Für Fragen zu Transport, Fahrtkosten, Rezeptgebühr und Hilfsmitteln."}


# Situation bundles ("Bündel") — owner: WS-K2. Read ONLY by app/services/benefits/bundles.py (deterministic, no LLM).
#
# A bundle = everything relevant for one life situation, in a curated (process) order, each item with an
# administrative reason (why_de, never medical) and a source. Status of benefit/offer items comes from the real
# eligibility engine (service.evaluate) with the request's facts and document recommendations; items that are
# `not_applicable` are left out. Prevention items come from the prevention engine (needs scope view_health_prevention;
# otherwise they are skipped). Office items resolve the nearest office from knowledge/offices.yaml by topic.
#
# Item fields:
#   kind: benefit | offer | prevention | appointment | office | form
#   ref:  benefit/offer id (benefits.yaml) | prevention rule id (prevention.yaml) | appointment topic (WS-T slot
#         search `topic`) | office topic (offices.yaml) | form id (knowledge/forms)
#   why_de: administrative reason; title_de: required for appointment items (others derive it)
#   source: SourceSpec (same syntax as benefits.yaml) — required for appointment items, optional otherwise
#   if_fact: only shown when this fact is true;  if_benefit: only shown when that benefit is not `not_applicable`
#
# Matching (free text, deterministic): text and keywords are lower-cased, umlauts folded (ä->ae, ö->oe, ü->ue, ß->ss),
# punctuation removed. A keyword matches at the start of a word ("pflege" matches "pflegen", "pflegebett").
# Score = 3 per strong + 1 per weak keyword; highest score wins, ties by file order; score 0 -> no bundle.
# `questions`: facts in priority order; the 2–3 highest-priority facts that are missing across the bundle's items
# become questions_de (texts in the top-level `questions` map).

version: 1

questions:
  care_need_months: "Wird die Unterstützung voraussichtlich mindestens sechs Monate lang nötig sein?"
  care_hours_estimate: "Wie viele Stunden Hilfe im Monat sind ungefähr nötig (z. B. Körperpflege, Essen, Haushalt, Wege)?"
  care_need_at_home: "Wird Hilfe bei der Pflege oder Betreuung zu Hause gebraucht (z. B. Heimhilfe, mobile Pflege)?"
  pflegegeld_level: "Wird bereits Pflegegeld bezogen – und wenn ja, in welcher Stufe?"
  pflegegeld_applied: "Wurde Pflegegeld schon beantragt?"
  aid_needed: "Wird ein Hilfsmittel wie Rollator, Gehhilfe oder Pflegebett gebraucht oder schon verwendet?"
  aid_prescribed: "Hat die Ärztin bzw. der Arzt das Hilfsmittel schon verordnet?"
  home_nursing_ordered: "Hat die Ärztin bzw. der Arzt medizinische Hauskrankenpflege angeordnet?"
  main_carer_since_months: "Pflegen Sie die Person überwiegend selbst – und seit wie vielen Monaten?"
  caregiver_main_carer: "Pflegen Sie die Person zu Hause und nimmt das einen großen Teil Ihrer Arbeitskraft in Anspruch?"
  carer_prevented: "Gibt es Zeiten, in denen Sie die Pflege nicht übernehmen können (z. B. Krankheit, Urlaub)?"
  care_24h_needed: "Ist eine Betreuung rund um die Uhr (24-Stunden-Betreuung) nötig oder geplant?"
  pflegekarenz_agreed: "Möchten Sie für die Pflege eine Pflegekarenz oder Pflegeteilzeit mit Ihrem Arbeitgeber vereinbaren?"
  caregiver_insured_3m: "Sind Sie seit mindestens drei Monaten durchgehend angestellt (vollversichert)?"
  walking_unable_confirmed: "Gibt es für Fahrten zur Behandlung eine ärztliche Transportanweisung?"
  reha_application_with_medical_statement: "Unterstützt die behandelnde Ärztin bzw. der behandelnde Arzt einen Reha-Antrag?"
  net_income_monthly: "Wie hoch ist das monatliche Nettoeinkommen (z. B. Pension)?"
  household: "Lebt die Person allein oder als Paar im Haushalt?"
  rgb_exempt: "Gibt es bereits eine Befreiung von der Rezeptgebühr?"
  treatment_type: "Sind regelmäßige Fahrten zu einer Behandlung nötig (z. B. Strahlen- oder Chemotherapie, Dialyse)?"
  distance_km: "Wie weit ist die Behandlungsstelle vom Wohnort entfernt (in km)?"
  costs_eur: "Welche krankheitsbedingten Kosten fallen an (ungefähr in Euro)?"
  financial_hardship: "Reichen Einkommen und Vermögen im Haushalt derzeit zum Leben aus?"
  familienbeihilfe_received: "Wird für das Kind bereits Familienbeihilfe bezogen?"
  shared_household_with_child: "Lebt das Kind mit Ihnen im gemeinsamen Haushalt (gleicher Hauptwohnsitz)?"
  diabetes_type2: "Wurde bei Ihnen ärztlich Diabetes Typ 2 festgestellt?"
  family_history: "Gibt es in Ihrer Familie Erkrankungen wie Darmkrebs, Brustkrebs, Diabetes oder Herz-Kreislauf-Erkrankungen? (Freiwillige Angabe – damit erklären wir, welche Vorsorgeprogramme besonders passen.)"

bundles:
  # ------------------------------------------------------------------------------------------------ Pflege zu Hause
  - id: pflege_zuhause
    title_de: Pflege und Unterstützung zu Hause
    situation_de: "Ein Angehöriger braucht im Alltag Hilfe (z. B. „Meine Mutter ist chronisch krank und kommt allein nicht mehr zurecht“)."
    match:
      strong: [mutter, vater, mama, papa, oma, opa, grossmutter, grossvater, schwiegermutter, schwiegervater, eltern,
               angehoerig, pflege, pflegen, pflegebeduerftig, allein nicht mehr, nicht mehr zurecht, kommt nicht zurecht,
               betreuung, betreuen, 24 stunden, rollator, demenz, dement, heimhilfe, pflegeheim,
               mother, father, parent, elderly, caregiver, care for, nursing]
      weak: [hilfe, helfen, chronisch, alt, zuhause, zu hause, unterstuetzung, alltag, help]
    questions: [care_need_months, care_need_at_home, pflegegeld_level, care_hours_estimate, aid_needed,
                main_carer_since_months, pflegekarenz_agreed, net_income_monthly]
    next_step_de: "Pflegegeld-Antrag (PAL 080) mit dem Formular-Assistenten vorbereiten und dabei die kostenlose Pflegeberatung zu Hause ankreuzen; parallel beim FSW (Tel. 01 24 5 24) Unterstützung zu Hause anfragen."
    items:
      - {kind: benefit, ref: pflegegeld, why_de: "Pflegegeld ist die zentrale Geldleistung bei dauerhaftem Pflegebedarf und Voraussetzung für viele weitere Hilfen (z. B. Ersatzpflege, 24-Stunden-Betreuung)."}
      - {kind: form, ref: pva_pflegegeld_pal080, if_benefit: pflegegeld, why_de: "Mit diesem Formular wird Pflegegeld bei der PVA beantragt; wir füllen es vor, Sie prüfen und unterschreiben."}
      - {kind: benefit, ref: pflegeberatung, why_de: "Eine diplomierte Pflegefachkraft berät kostenlos zu Hause und kennt die regionalen Angebote."}
      - {kind: benefit, ref: fsw_mobile_pflege, why_de: "In Wien organisiert der FSW Heimhilfe und mobile Pflege zu Hause."}
      - {kind: form, ref: fsw_foerderung, if_benefit: fsw_mobile_pflege, why_de: "Antrag auf Förderung von Leistungen beim FSW."}
      - {kind: benefit, ref: heilbehelfe_hilfsmittel, why_de: "Hilfsmittel wie Rollator, Gehhilfe oder Pflegebett zahlt die ÖGK auf ärztliche Verordnung mit."}
      - {kind: benefit, ref: hauskrankenpflege, why_de: "Medizinische Pflege zu Hause (z. B. Wundversorgung) gibt es auf ärztliche Anordnung."}
      - {kind: appointment, ref: pflegeberatung, title_de: "Beratungstermin zur Pflege vereinbaren",
         why_de: "Ein persönliches Beratungsgespräch hilft, Pflegegeld, mobile Dienste und Hilfsmittel aufeinander abzustimmen.",
         source: {form: fsw_foerderung, page: 1, label: "FSW Antrag auf Förderung von Leistungen, S. 1"}}
      - {kind: benefit, ref: ersatzpflege, why_de: "Für pflegende Angehörige: Zuschuss, wenn Sie wegen Krankheit oder Urlaub eine Vertretung brauchen."}
      - {kind: benefit, ref: foerderung_24h_betreuung, why_de: "Wenn eine Betreuung rund um die Uhr nötig wird, gibt es eine Förderung."}
      - {kind: benefit, ref: pflegekarenzgeld, why_de: "Für berufstätige Angehörige: Geld während einer vereinbarten Pflegekarenz oder Pflegeteilzeit."}
      - {kind: benefit, ref: selbstversicherung_pflege, why_de: "Für pflegende Angehörige: Pensionsversicherung während der Pflege zu Hause."}
      - {kind: benefit, ref: angebot_trittsicher, why_de: "Kostenlose Kurse zur Sturzvorbeugung ab 65."}
      - {kind: benefit, ref: rezeptgebuehrenbefreiung, why_de: "Bei geringem Einkommen entfällt die Rezeptgebühr – und damit auch Kostenanteile, z. B. bei Hilfsmitteln."}
      - {kind: office, ref: pflegegeld, why_de: "Zuständig für Pflegegeld und Pflegeberatung."}

  # ------------------------------------------------------------------------------------------------ Nach dem Spital

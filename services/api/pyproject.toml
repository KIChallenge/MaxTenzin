[project]
name = "sv-ki-lotse-api"
version = "0.1.0"
description = "SV KI-Lotse backend: deterministic services + AI top layer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "openai>=1.50",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "fonttools>=4.68.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["app", "../../tools", "../../evals"]
